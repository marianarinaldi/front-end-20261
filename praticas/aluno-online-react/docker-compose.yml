services:
  app:
    image: node:24
    container_name: aluno-online-react
    working_dir: /app
    build: .
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173" # Porta do Vite
      - "3000:3000"  # Porta do JSON Server exposta e mapeada
    tty: true
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true # Util para hot reload no Linux/Docker